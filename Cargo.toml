[package]
name = "armature-mcp"
version = "0.3.1"
edition = "2024"
# Inherits the workspace MSRV (1.94.1). This crate's own floor is 1.91 — the
# `register_mcp_tool!` macro expands to an `inventory::submit!` `static` whose
# `McpToolEntry::new` must be `const fn`, needing `TypeId::of` in const context
# (stable since Rust 1.91) — but the workspace floor is already higher, so no
# per-crate override is needed.
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-mcp"
homepage = "https://quinnjr.github.io/armature"
description = "Model Context Protocol (MCP) server support for Armature applications"
keywords = ["mcp", "ai", "llm", "tools", "armature"]
categories = ["web-programming", "development-tools"]

[dependencies]
armature-core = { version = "0.9" }
armature-http-client = { version = "0.2" }
armature-proc-macro = { version = "0.4" }
armature-jwt = { version = "0.3" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Diagnostics for malformed compile-time registrations (see `McpToolEntry::to_definition`)
tracing = "0.1"

# Compile-time collection of MCP tools
inventory = "0.3"

# Schema generation
schemars = "1.2"

# UUID for request IDs
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
trybuild = "1"
